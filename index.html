<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravelStay</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
TravelStay
</header>

<div class="search-box">
<input type="text" id="searchInput" placeholder="Search destination">
<button onclick="searchPlaces()">Search</button>
</div>

<div class="container">

<div class="card">
<img src="https://images.unsplash.com/photo-1566073771259-6a8506099945">
<div class="card-body">
<h3>Luxury Hotel</h3>
<p>Delhi, India</p>
<div class="price">₹3,500 / night</div>
<button class="book">Book Now</button>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1582719508461-905c673771fd">
<div class="card-body">
<h3>Beach Resort</h3>
<p>Goa, India</p>
<div class="price">₹5,200 / night</div>
<button class="book">Book Now</button>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1505691938895-1758d7feb511">
<div class="card-body">
<h3>Mountain Stay</h3>
<p>Manali, India</p>
<div class="price">₹2,800 / night</div>
<button class="book">Book Now</button>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1522708323590-d24dbb6b0267">
<div class="card-body">
<h3>City Apartment</h3>
<p>Mumbai, India</p>
<div class="price">₹4,000 / night</div>
<button class="book">Book Now</button>
</div>
</div>

</div>

<footer>
© 2026 TravelStay | Cloud Computing Project
</footer>

<script src="script.js"></script>

</body>
</html>
